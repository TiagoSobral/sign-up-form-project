<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="javascript/script.js" defer></script>
    <title>Sign Up Form</title>
</head>
<body>
    <header>
        
    </header>
    <main>
        <section>
            <h2>This is not a real online service! 
                You know you need something like this in your life to help you realize your deepest dreams.
                
                <p>Sign up <i>now</i> to get started.</p>

                <p>You <i>know</i> you want to.</p>
            </h2>

        </section>
        <form action="" method="post">
                <legend>Let's do this!</legend>
                
                <fieldset class="name">
                    <div class="first-name">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="user-first-name">
                    </div>
                    <div class="last-name">
                        <label for="user-last-name">Last Name</label>
                        <input type="text" id="user-last-name" name="user-last-name">
                    </div>
                </fieldset>
                <fieldset class="contact-info">
                    <div class="email">
                        <label for="user-email">Email</label>
                        <input type="email" id="user-email" name="user-email">
                    </div>
                    <div class="phone">
                        <label for="user-phone">Phone Number</label>
                        <input type="tel" id="user-phone" name="user-phone">
                    </div>
                </fieldset>
                <fieldset class="password">
                    <div class="new-password">
                        <label for="user-pass">Password</label>
                        <input type="password" id="user-pass" name="user-pass">
                    </div>
                    <div class="confirm-password">
                        <label for="user-pass-confirm">Confirm Password</label>
                        <input type="password" id="user-pass-confirm" name="user-pass-confirm">
                    </div>
                </fieldset>
                <fieldset class="create-account">
                    <div class="account-button"><button type="submit">Create Account</button></div>
                    <div class="log-in">Already have an account? <a href="">Log in</a></div>
                </fieldset>
        </form>
    </main>
</body>
</html>
